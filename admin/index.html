<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142b35">
<title>Admin Login | Bagan Marathon 2026 Official Dinner</title>
<link rel="stylesheet" href="../style.css">
<style>
.admin-wrap{max-width:1050px;margin:38px auto;padding:0 16px 60px}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:#f2d99f;background:#142b35;padding:18px 22px}
.admin-top a{color:#f2d99f}
#adminDashboard[hidden],#adminLogin[hidden]{display:none!important}
.admin-row{overflow-wrap:anywhere}
.admin-row button{cursor:pointer}
.admin-row .admin-action{border:0;border-radius:6px;padding:10px 15px;font-weight:800;letter-spacing:.4px;min-height:38px;transition:filter .15s,transform .15s}
.admin-row .admin-action:hover{filter:brightness(.94);transform:translateY(-1px)}
.admin-row .admin-edit{background:#f2c14e;color:#382800;border:1px solid #d6a52d}
.admin-row .admin-approve{background:#f1f3f4;color:#34434a;border:1px solid #cbd2d5}
.admin-row .admin-approve.is-approved{background:#218a52;color:#fff;border:1px solid #176b3e}
.admin-row .admin-reject{background:#c83e43;color:#fff;border:1px solid #a92e34}
.admin-row .admin-action:focus-visible{outline:3px solid #142b35;outline-offset:2px}
.admin-row .admin-action:disabled{opacity:.65;cursor:wait;transform:none}
.status-pill{font-weight:700}.admin-row{border-bottom:1px solid #ddd;padding:14px 0}.admin-row button{margin:5px}.edit-panel{margin:12px 0;padding:16px;border:1px solid #d8c69a;border-radius:8px;background:#fffaf0}.edit-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.edit-form label{display:block}.edit-form input,.edit-form textarea,.edit-form select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}.edit-actions{display:flex;gap:8px;flex-wrap:wrap}
.capacity-overview{margin:18px 0 24px;padding:20px;border:1px solid #e4d5b4;border-radius:14px;background:linear-gradient(135deg,#fffdf7,#f5f8f7);color:#18323a}
.capacity-overview h3{margin:0 0 5px;color:#18323a}
.capacity-overview .capacity-subtitle{margin:0 0 16px;color:#63747a;font-size:.92rem}
.capacity-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.capacity-stat{padding:14px;border-radius:10px;background:#fff;border:1px solid #e9e5dc}
.capacity-stat span{display:block;color:#6c777a;font-size:.82rem}
.capacity-stat strong{display:block;margin-top:5px;font-size:clamp(1.45rem,3vw,2rem);color:#18323a;font-variant-numeric:tabular-nums}
.capacity-chart-row{display:flex;align-items:center;gap:22px;margin-top:20px;flex-wrap:wrap}
.capacity-donut{width:150px;height:150px;flex:0 0 150px;border-radius:50%;background:conic-gradient(#d4a64e 0 var(--used),#e6ecea var(--used) 100%);display:grid;place-items:center;position:relative}
.capacity-donut:before{content:"";position:absolute;inset:13px;border-radius:50%;background:#fffdf7}
.capacity-donut-inner{position:relative;text-align:center;z-index:1}
.capacity-donut-inner strong{display:block;font-size:1.55rem;color:#18323a}
.capacity-donut-inner small{color:#657478}
.capacity-legend{flex:1;min-width:190px}
.capacity-legend p{margin:7px 0;color:#44575d}
.capacity-key{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;background:#d4a64e}
.capacity-key.left{background:#e6ecea;border:1px solid #cbd5d1}
.capacity-progress{height:12px;background:#e6ecea;border-radius:99px;overflow:hidden;margin-top:12px}
.capacity-progress>span{display:block;height:100%;width:var(--used);background:linear-gradient(90deg,#2a9d8f,#d4a64e);border-radius:99px;transition:width .4s ease}
@media(max-width:600px){.capacity-grid{grid-template-columns:1fr}.capacity-chart-row{gap:15px}.capacity-donut{width:128px;height:128px;flex-basis:128px}}

</style>
</head>
<body>
<header class="admin-top"><strong>BAGAN MARATHON 2026 · ADMIN</strong><a href="../">Back to Home</a></header>
<main class="admin-wrap">
 <div class="section-heading"><p class="eyebrow">AUTHORIZED PERSONNEL ONLY</p><h2>Admin Dashboard</h2><p>Sign in to review dinner registrations and payment proofs.</p></div>
 <form id="adminLogin" class="form-card narrow">
  <label>Admin Password<input type="password" name="password" required autocomplete="current-password"></label>
  <button class="gold-button full" id="loginButton">ADMIN LOGIN</button>
  <p id="adminMessage" class="message" role="status"></p>
 </form>
 <section id="adminDashboard" hidden></section>
</main>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzJmy2-nl8hd2XZuCv2PDyF9_srQ36RLF7O1H-X4hBD7uxvvpty-T_oZntu61x3Vf5ltQ/exec";
const $ = s => document.querySelector(s);
let adminPassword = "";
function msg(el, text, ok=false){el.textContent=text;el.classList.toggle("success",ok)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(action,data={}) {
 const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data})});
 const result=await response.json();
 if(!result.ok) throw new Error(result.error||"Request failed");
 return result;
}
$("#adminLogin").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=$("#loginButton"), password=new FormData(e.currentTarget).get("password");
 button.disabled=true;button.textContent="CHECKING...";
 try{
  await api("adminList",{password});
  adminPassword=password;
  $("#adminLogin").hidden=true;
  msg($("#adminMessage"),"Login successful.",true);
  await loadAdmin();
 }catch(error){msg($("#adminMessage"),error.message)}
 finally{button.disabled=false;button.textContent="ADMIN LOGIN"}
});
function renderCapacityOverview(records, capacity){
 const limit=Math.max(0,Number(capacity)||0);
 // Pending and Approved guests occupy capacity; Rejected registrations release it.
 const occupied=(records||[]).filter(x=>String(x.approvalStatus||"").toLowerCase()!=="rejected")
   .reduce((sum,x)=>sum+Math.max(0,Number(x.guests)||0),0);
 const left=Math.max(0,limit-occupied);
 const usedPct=limit>0?Math.min(100,Math.round(occupied/limit*100)):0;
 const leftPct=limit>0?Math.max(0,100-usedPct):0;
 const safePct=Number.isFinite(usedPct)?usedPct:0;
 $("#capacityOverview").innerHTML=
  '<h3>Guest Capacity Overview</h3>'+
  '<p class="capacity-subtitle">Pending and approved guests count toward reserved capacity. Rejected registrations are excluded.</p>'+
  '<div class="capacity-grid">'+
   '<div class="capacity-stat"><span>Total Guest Capacity</span><strong>'+limit.toLocaleString()+'</strong></div>'+
   '<div class="capacity-stat"><span>Reserved Guests</span><strong>'+occupied.toLocaleString()+'</strong></div>'+
   '<div class="capacity-stat"><span>Available Guests Left</span><strong>'+left.toLocaleString()+'</strong></div>'+
  '</div>'+
  '<div class="capacity-chart-row">'+
   '<div class="capacity-donut" style="--used:'+safePct+'%"><div class="capacity-donut-inner"><strong>'+safePct+'%</strong><small>Capacity used</small></div></div>'+
   '<div class="capacity-legend">'+
    '<p><span class="capacity-key"></span><b>'+safePct+'%</b> capacity reached</p>'+
    '<p><span class="capacity-key left"></span><b>'+leftPct+'%</b> capacity remaining</p>'+
    '<p><b>'+left.toLocaleString()+'</b> guest slot(s) remaining out of '+limit.toLocaleString()+'</p>'+
    '<div class="capacity-progress" role="progressbar" aria-label="Guest capacity used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+safePct+'" style="--used:'+safePct+'%"><span></span></div>'+
   '</div>'+
  '</div>';
}
function renderAdminRecords(records){
 const methods=["KBZPay","CBPay","AYAPay","WavePay"];
 const getMethod=x=>{const v=String(x.paymentMethod??"").trim();return methods.find(m=>m.toLowerCase()===v.toLowerCase())||"Other"};
 $("#paymentMethodSummary").innerHTML=methods.concat("Other").map(method=>{
  const group=records.filter(x=>getMethod(x)===method);
  const guests=group.reduce((sum,x)=>sum+(Number(x.guests)||0),0);
  return '<div class="payment-method-stat"><b>'+esc(method==="Other"?"Other / Not specified":method)+'</b><strong>'+group.length+'</strong><small>registration(s) · '+guests+' guest(s)</small></div>';
 }).join("");
 const selected=$("#paymentMethodFilter").value;
 const filtered=selected==="All"?records:records.filter(x=>getMethod(x)===selected);
 $("#adminRows").innerHTML=filtered.map(x=>'<div class="admin-row"><b>'+esc(x.name)+'</b> · '+esc(x.guests)+' guest(s)<br><small>Payment Method: <b>'+esc(x.paymentMethod||"Not specified")+'</b><br>'+esc(x.registrationId)+' · '+esc(x.paymentReference)+' · '+esc(x.approvalStatus)+'</small><br><span>Email: '+esc(x.email)+' · Phone: '+esc(x.phone)+'</span><br><a href="'+esc(x.screenshotUrl)+'" target="_blank" rel="noopener">View payment proof</a><br><button type="button" class="admin-action admin-edit" data-edit="'+esc(x.registrationId)+'">EDIT</button> <button type="button" class="admin-action admin-approve '+(String(x.approvalStatus||"").toLowerCase()==="approved"?"is-approved":"")+'" data-approve="'+esc(x.registrationId)+'">'+(String(x.approvalStatus||"").toLowerCase()==="approved"?"APPROVED":"APPROVE")+'</button> <button type="button" class="admin-action admin-reject" data-reject="'+esc(x.registrationId)+'">REJECT</button><div id="edit-'+esc(x.registrationId)+'"></div></div>').join("")||"<p>No registrations found.</p>";
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>showEditForm(records.find(x=>x.registrationId===b.dataset.edit)));
 document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>updateApproval(b.dataset.approve,"Approved"));
 document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>updateApproval(b.dataset.reject,"Rejected"));
}
async function loadAdmin(){
 const box=$("#adminDashboard");box.hidden=false;box.innerHTML='<div class="form-card">Loading dashboard...</div>';
 try{
  const r=await api("adminList",{password:adminPassword});
  const records=Array.isArray(r.records)?r.records:[];
  box.innerHTML='<div class="form-card"><div id="capacityOverview" class="capacity-overview"></div><h2>Capacity & Registration Control</h2><p>Approved guests: <b>'+esc(r.stats.approvedGuests)+'</b> · Pending registrations: <b>'+esc(r.stats.pending)+'</b></p><label>Maximum Guest Capacity<input id="capacityInput" type="number" min="1" value="'+esc(r.settings.capacity||100)+'"></label><label><input id="openInput" type="checkbox" '+(r.settings.open?'checked':'')+'> Registration Open</label><h2 style="margin-top:24px">Dinner Date &amp; Time</h2><p>Change the event date and start time shown on the public Home Page. Time is Myanmar Time (MMT, UTC+6:30).</p><div class="edit-form"><label>Dinner Date<input id="eventDateInput" type="date" required value="'+esc(r.settings.eventDate||'2026-11-22')+'"></label><label>Dinner Time (MMT)<input id="eventTimeInput" type="time" required value="'+esc(r.settings.eventTime||'18:00')+'"></label></div><button class="gold-button" id="saveSettings">SAVE SETTINGS</button><p id="settingMessage" class="message"></p><h2>Registrations by Payment Method</h2><div id="paymentMethodSummary" class="payment-method-summary"></div><label>Filter by Payment Method<select id="paymentMethodFilter"><option value="All">All Payment Methods</option><option value="KBZPay">KBZPay</option><option value="CBPay">CBPay</option><option value="AYAPay">AYAPay</option><option value="WavePay">WavePay</option><option value="Other">Other / Not specified</option></select></label><button class="gold-button" id="exportCsv">EXPORT CSV</button><div id="adminRows"></div></div>';
  $("#saveSettings").onclick=async()=>{const button=$("#saveSettings");button.disabled=true;try{const capacity=Number($("#capacityInput").value);const eventDate=$("#eventDateInput").value;const eventTime=$("#eventTimeInput").value;if(!Number.isInteger(capacity)||capacity<1)throw new Error("Enter a valid capacity of at least 1.");if(!eventDate||!eventTime)throw new Error("Please enter both the dinner date and time.");await api("saveSettings",{password:adminPassword,capacity,open:$("#openInput").checked,eventDate,eventTime});await loadAdmin();msg($("#settingMessage"),"Settings saved. Public dinner date and time updated.",true)}catch(e){msg($("#settingMessage"),e.message);button.disabled=false}};
  $("#exportCsv").onclick=()=>{const records=Array.isArray(r.records)?r.records:[];const rows=[["Registration ID","Name","Email","Phone","Guests","Amount","Payment Method","Payment Reference","Payment Status","Approval Status"],...records.map(x=>[x.registrationId,x.name,x.email,x.phone,x.guests,x.amount,x.paymentMethod,x.paymentReference,x.paymentStatus,x.approvalStatus])];const csv="\ufeff"+rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="bagan-dinner-registrations.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
  renderCapacityOverview(records,r.settings.capacity||100);renderAdminRecords(records);$("#paymentMethodFilter").onchange=()=>renderAdminRecords(records);
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>showEditForm((r.records||[]).find(x=>x.registrationId===b.dataset.edit)));
  document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>updateApproval(b.dataset.approve,"Approved"));
  document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>updateApproval(b.dataset.reject,"Rejected"));
 }catch(e){box.innerHTML='<div class="form-card message">'+esc(e.message)+'</div>'}
}

function showEditForm(x){
 if(!x)return;
 const host=document.getElementById("edit-"+x.registrationId);
 host.innerHTML='<form class="edit-panel edit-form">'+
 '<label>Full Name<input name="name" maxlength="120" required value="'+esc(x.name)+'"></label>'+
 '<label>Email<input name="email" type="email" maxlength="180" required value="'+esc(x.email)+'"></label>'+
 '<label>Phone<input name="phone" maxlength="30" required value="'+esc(x.phone)+'"></label>'+
 '<label>Viber<input name="viber" maxlength="30" value="'+esc(x.viber||"")+'"></label>'+
 '<label>Number of Guests<input name="guests" type="number" min="1" max="20" required value="'+esc(x.guests)+'"></label>'+
 '<label>Payment Method<select name="paymentMethod"><option value="KBZPay" '+(x.paymentMethod==="KBZPay"?"selected":"")+'>KBZPay</option><option value="CBPay" '+(x.paymentMethod==="CBPay"?"selected":"")+'>CBPay</option><option value="AYAPay" '+(x.paymentMethod==="AYAPay"?"selected":"")+'>AYAPay</option><option value="WavePay" '+(x.paymentMethod==="WavePay"?"selected":"")+'>WavePay</option></select></label>'+
 '<label>Payment Reference<input name="paymentReference" maxlength="100" required value="'+esc(x.paymentReference)+'"></label>'+
 '<label style="grid-column:1/-1">Remark<textarea name="remark" maxlength="500">'+esc(x.remark||"")+'</textarea></label>'+
 '<div class="edit-actions" style="grid-column:1/-1"><button class="gold-button" type="submit">SAVE CHANGES</button><button type="button" data-cancel>Cancel</button><span class="message" role="status"></span></div></form>';
 const form=host.querySelector("form");
 form.addEventListener("submit",async e=>{
  e.preventDefault();const button=form.querySelector('[type="submit"]');button.disabled=true;
  const d=Object.fromEntries(new FormData(form).entries());d.guests=Number(d.guests);
  try{await api("updateRecord",{password:adminPassword,registrationId:x.registrationId,record:d});await loadAdmin();alert("Registration updated successfully.");}
  catch(err){msg(form.querySelector(".message"),err.message);button.disabled=false;}
 });
 form.querySelector("[data-cancel]").onclick=()=>host.innerHTML="";
}
async function updateApproval(id,status){if(!confirm(status+" this registration?"))return;try{await api("updateApproval",{password:adminPassword,registrationId:id,status});await loadAdmin()}catch(e){alert(e.message)}}
</script>
</body>
</html>
